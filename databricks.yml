# Databricks Asset Bundle: deploys the pipeline as a 5-task job
# (ingest from Azure ADLS -> bronze -> silver -> gold -> quality) on serverless compute.
#
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run olist_lakehouse_job -t dev
#
# Works on Databricks Free Edition and on Azure Databricks.

bundle:
  name: olist_lakehouse

variables:
  catalog:
    description: Unity Catalog catalog that holds the bronze/silver/gold schemas
    default: workspace
  raw_path:
    description: Landing zone the ingest task writes to and bronze reads from (UC Volume)
    default: /Volumes/workspace/raw/landing
  ingest_source:
    description: "adls = Azure Data Lake Storage Gen2 (needs the olist/adls-sas secret), kaggle = public download"
    default: adls
  azure_account:
    description: Azure storage account (ADLS Gen2) that holds the raw files
    default: olistlakelochana

resources:
  jobs:
    olist_lakehouse_job:
      name: olist-lakehouse-${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 6 * * ?" # daily 06:30
        timezone_id: Asia/Colombo
        pause_status: PAUSED # un-pause in the UI when you want it to run daily
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - azure-storage-file-datalake>=12.16
      tasks:
        - task_key: ingest
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_layer.py
            parameters: [--src, "${workspace.file_path}/src", --layer, ingest, --catalog, "${var.catalog}",
                         --raw-path, "${var.raw_path}", --ingest-source, "${var.ingest_source}",
                         --azure-account, "${var.azure_account}"]
        - task_key: bronze
          depends_on: [{ task_key: ingest }]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_layer.py
            parameters: [--src, "${workspace.file_path}/src", --layer, bronze,
                         --catalog, "${var.catalog}", --raw-path, "${var.raw_path}"]
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_layer.py
            parameters: [--src, "${workspace.file_path}/src", --layer, silver, --catalog, "${var.catalog}"]
        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_layer.py
            parameters: [--src, "${workspace.file_path}/src", --layer, gold, --catalog, "${var.catalog}"]
        - task_key: quality
          depends_on: [{ task_key: gold }]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_layer.py
            parameters: [--src, "${workspace.file_path}/src", --layer, quality, --catalog, "${var.catalog}"]

sync:
  exclude:
    - data/**
    - .venv/**

targets:
  dev:
    mode: development # prefixes resources with [dev <user>] and pauses schedules
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
